name: Trip V5 regression
on:
  push:
    branches: [main, work/trip-v5]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: trip-v5-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Expand and verify staging source bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,lzma,json
          parts=sorted(Path('scripts').glob('v5-source-*.b64'))
          if parts:
              assert '${{ github.ref }}' == 'refs/heads/work/trip-v5', 'Staging bundles must never reach main'
              raw=base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True)
              assert hashlib.sha256(raw).hexdigest()=='3e51a58da548faa8e36d41e89d2e20750bcc9988e549b01afaf869c6727436f6'
              sources=json.loads(lzma.decompress(raw))
              for name,content in sources.items():
                  path=Path(name)
                  assert not path.is_absolute() and '..' not in path.parts
                  if name=='scripts/vendor-v5.py':
                      old="   assert names,'License missing';(root/licensefile).write_bytes(source.extractfile(names[0]).read())"
                      new="""   if names:
              (root/licensefile).write_bytes(source.extractfile(names[0]).read())
             else:
              # This pinned fontkit release declares MIT in README and package.json.
              import json
              metadata=json.loads(source.extractfile('package/package.json').read())
              assert package=='@pdf-lib/fontkit@1.1.1' and metadata.get('license')=='MIT','Unverified package license'
              readme=source.extractfile('package/README.md').read()
              assert b'MIT' in readme,'License declaration missing'
              (root/licensefile).write_bytes(b'Package licensing and attribution (unaltered upstream README):\\n\\n'+readme)
              (root/'fontkit-package.json').write_text(json.dumps(metadata,ensure_ascii=False,indent=2),encoding='utf-8')"""
                      assert old in content
                      content=content.replace(old,new)
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_text(content,encoding='utf-8')
              for part in parts: part.unlink()
          PY
          python scripts/apply-v5.py
          python scripts/update-v5-export.py
      - name: Install test tools and browser dependencies
        run: |
          mkdir -p test-results/v5
          {
            pip install playwright==1.55.0 pymupdf==1.26.3 fonttools==4.59.2 brotli==1.1.0 &&
            python -m playwright install --with-deps chromium webkit &&
            sudo apt-get install -y fonts-noto-cjk &&
            python scripts/vendor-v5.py
          } > test-results/v5/dependencies.log 2>&1 || { tail -60 test-results/v5/dependencies.log; exit 1; }
          tail -5 test-results/v5/dependencies.log
      - name: Keep expanded staging source reviewable
        if: github.ref == 'refs/heads/work/trip-v5'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html trip-export.js v5-* scripts vendor
          if ! git diff --cached --quiet; then
            git commit -m 'Expand V5 sources and vendor local searchable-PDF dependencies'
            git push origin HEAD:work/trip-v5
          fi
      - name: Check syntax and original fee parity
        run: |
          node --check v5-engine.js
          node --check v5-experience.js
          node --check v5-report.js
          node --check trip-export.js
          python - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile
          for text in re.findall(r'<script>([\s\S]*?)</script>',Path('index.html').read_text()):
              with tempfile.NamedTemporaryFile(mode='w',suffix='.js') as f:
                  f.write(text);f.flush();subprocess.run(['node','--check',f.name],check=True)
          PY
          node scripts/test-v5-engine.cjs
      - name: Chromium and WebKit end-to-end tests
        run: python -u scripts/test-v5.py 2>&1 | tee test-results/v5/browser.log
      - name: Rebuild and verify deployed V5 assets
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
          python - <<'PY'
          from pathlib import Path
          import time,urllib.request
          base='https://jspusa.github.io/Trip/'
          paths=['index.html','trip-export.js','v5-engine.js','v5-experience.js','v5-report.js','v5-experience.css']
          for attempt in range(40):
              try:
                  for path in paths:
                      request=urllib.request.Request(base+path+'?verify='+str(time.time_ns()),headers={'Cache-Control':'no-cache'})
                      actual=urllib.request.urlopen(request,timeout=20).read()
                      assert actual==Path(path).read_bytes(),'Waiting for live '+path
                  print('LIVE_V5_ASSETS_VERIFIED',flush=True)
                  break
              except Exception as error:
                  print(error,flush=True)
                  if attempt==39:raise
                  time.sleep(10)
          PY
          python -u scripts/test-v5.py --live https://jspusa.github.io/Trip/ 2>&1 | tee test-results/v5/live.log
      - name: Package reviewable source and rendered test evidence
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          with ZipFile('v5-source-review.zip','w',ZIP_DEFLATED) as z:
              for pattern in ['v5-*.js','v5-*.css','trip-export.js','index.html','scripts/*v5*']:
                  for path in Path('.').glob(pattern):
                      if path.is_file() and path.suffix not in ['.zip','.ttf','.otf','.b64']:
                          z.write(path)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trip-v5-regression
          path: |
            test-results/v5/
            v5-source-review.zip
          retention-days: 7
