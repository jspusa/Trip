name: Trip V5.2 regression and publish
on:
  push:
    branches: [main, work/trip-v52-v46-minimal, work/trip-v52-report-pdf]
    paths:
      - index.html
      - trip-export.js
      - trip-export.css
      - v52-minimal.css
      - v52-motion.js
      - v52-report.js
      - scripts/apply-ui-upgrade.py
      - scripts/test-ui-upgrade.py
      - .github/workflows/trip-ui-upgrade.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trip-v52-regression
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify V5.2 entry point and syntax
        run: |
          python scripts/apply-ui-upgrade.py
          node --check trip-export.js
          node --check v52-motion.js
          node --check v52-report.js
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          source=Path('index.html').read_text()
          for script in re.findall(r'<script>([\s\S]*?)</script>',source):
              with tempfile.NamedTemporaryFile(suffix='.js',mode='w') as target:
                  target.write(script);target.flush();subprocess.run(['node','--check',target.name],check=True)
          PY
      - name: Install browser dependencies
        run: |
          pip install playwright==1.55.0 pymupdf==1.26.3
          python -m playwright install --with-deps chromium webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Run V4.6 functional and PDF regression under V5.2 shell
        run: python scripts/test-ui-upgrade.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trip-v52-regression
          path: test-results/
          retention-days: 7
